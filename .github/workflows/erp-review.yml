name: ERP branch checks (no deployment)
on:
  push:
    branches: [erp-updates, erp-updates-current, erp-shared-purchasing, erp-shared-reporting, erp-reporting-quality, erp-inventory-management-20261116, fix/shared-mrp, erp-menu-history, erp-mrp-workspace-20261116, erp-final-completion, erp-final-completion-v2, erp-final-combined-v3]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for newer work on main
        run: |
          git fetch origin main
          node scripts/check-main-baseline.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the combined app
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Run workflow and preservation checks
        run: node tests/run-all.mjs

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: erp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Test migrations and purchasing transactions in disposable PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGDATABASE: erp_test
          PGUSER: postgres
          PGPASSWORD: local-ci-only
        run: |
          exec > >(tee /tmp/erp-postgres.log) 2>&1
          psql -v ON_ERROR_STOP=1 -f tests/sql/purchasing-bootstrap.sql
          for migration in supabase/migrations/*.sql; do
            # New history wrappers depend on the reporting/inventory suites below.
            if [ "$(basename "$migration")" = 202611170001_menu_history_contacts.sql ] || [ "$(basename "$migration")" = 202611170002_inventory_usage_performance.sql ] || [ "$(basename "$migration")" = 202611170004_erp_completion.sql ]; then
              continue
            fi
            # Verify the older preservation suites before applying the final
            # numbered-order and deferred-consumption rollout in completion.sql.
            if [ "$(basename "$migration")" = 202611180001_sales_orders_pos.sql ] || [ "$(basename "$migration")" = 202611190001_mrp_confirmed_demand.sql ] || [ "$(basename "$migration")" = 202611190002_mrp_planning_hardening.sql ]; then
              continue
            fi
            # Reporting tests capture existing rows/functions before applying it.
            if [ "$(basename "$migration")" = 202611160006_shared_mrp.sql ] || [ "$(basename "$migration")" = 202611160001_shared_reporting.sql ] || [ "$(basename "$migration")" = 202611160003_reporting_quality.sql ]; then
              continue
            fi
            # This earlier correction targets eight verified live seed UUIDs.
            # A fresh CI database has none of that imported dataset; do not
            # rewrite or weaken the live migration's strict row-count guard.
            if [ "$(basename "$migration")" = 202611160005_retime_seed_opening_stock.sql ]; then
              continue
            fi
            # Test the deliberate inventory RPC hardening after preservation tests.
            if [ "$(basename "$migration")" = 202611160004_inventory_management.sql ]; then
              continue
            fi
            if [ "$(basename "$migration")" = 202611150002_shared_purchasing.sql ]; then
              psql -v ON_ERROR_STOP=1 -f tests/sql/purchasing-before-migration.sql
            fi
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
          psql -v ON_ERROR_STOP=1 -f tests/sql/shared-purchasing.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611150002_shared_purchasing.sql
          psql -v ON_ERROR_STOP=1 -c "select public.ci_assert((select order_cost=35 from public.erp_purchasing_options),'repeat migration reset options'); select public.ci_assert((select count(*)=3 from public.erp_purchase_receipts),'repeat migration reset receipts'); select public.ci_assert((select count(*)=3 from public.erp_supplier_payments),'repeat migration reset payments');"
          node tests/sql/purchasing-concurrency.mjs
          psql -v ON_ERROR_STOP=1 -f tests/sql/shared-reporting.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/reporting-quality.sql
          run_checked() {
            local inventory_log
            inventory_log="$(mktemp)"
            if "$@" >"$inventory_log" 2>&1; then
              cat "$inventory_log"
              rm "$inventory_log"
            else
              local inventory_status=$?
              cat "$inventory_log"
              python3 -c 'import pathlib,sys; s=pathlib.Path(sys.argv[1]).read_text()[-3500:]; print("::error::"+s.replace("%","%25").replace("\r","%0D").replace("\n","%0A"))' "$inventory_log"
              rm "$inventory_log"
              return "$inventory_status"
            fi
          }
          run_checked psql -v ON_ERROR_STOP=1 -f tests/sql/dough-migration.sql
          run_checked node tests/sql/seed-retiming.mjs
          run_checked psql -v ON_ERROR_STOP=1 -f tests/sql/inventory-management.sql
          run_checked node tests/sql/inventory-concurrency.mjs
          # Apply MRP after the existing inventory rollout and preservation
          # suites; the production migration is versioned after inventory.
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611160006_shared_mrp.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/mrp-rubric.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202611160006_shared_mrp.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/menu-history.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/inventory-usage-performance.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/pos-loyalty.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/completion.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/shared-mrp.sql
          psql -v ON_ERROR_STOP=1 -f tests/sql/mrp-confirmed-demand.sql
          node tests/sql/mrp-concurrency.mjs
          psql -v ON_ERROR_STOP=1 -f tests/sql/mrp-hardening.sql
          node tests/sql/mrp-hardening-concurrency.mjs
      - name: Publish database diagnostic on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          let log='';try{log=readFileSync('/tmp/erp-postgres.log','utf8');}catch{}
          const detail=log.split('\n').findLast(line=>/AssertionError|TEST FAILED|ERROR:|FATAL:|Error:/.test(line))??'Database check failed; see the workflow log.';
          const response=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/statuses/'+process.env.GITHUB_SHA,{method:'POST',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'},body:JSON.stringify({state:'failure',context:'Database diagnostic',description:detail.slice(0,140),target_url:'https://github.com/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID})});
          if(!response.ok)throw Error('Unable to publish database diagnostic: '+response.status);
          const tail=log.slice(-1800).replace(/\x1b\[[0-9;]*m/g,'').replace(/\s+/g,' ');
          for(let offset=0;offset<tail.length;offset+=140){
            const detailResponse=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/statuses/'+process.env.GITHUB_SHA,{method:'POST',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'},body:JSON.stringify({state:'failure',context:'Database log '+String(offset/140+1).padStart(2,'0'),description:tail.slice(offset,offset+140),target_url:'https://github.com/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID})});
            if(!detailResponse.ok)throw Error('Unable to publish database detail: '+detailResponse.status);
          }

          JS

  mrp-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install browser test tools without changing app dependencies
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
          git diff --exit-code -- package.json package-lock.json
      - name: Exercise the MRP workspace with synthetic data
        run: node tests/browser/mrp-workspace.mjs
      - name: Exercise POS checkout and independent scrolling with synthetic data
        run: node tests/browser/pos-workspace.mjs
      - name: Save POS layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pos-ui-screenshots
          path: test-results/pos/*.png
          if-no-files-found: ignore
      - name: Exercise navigation, store context, and purchasing with synthetic data
        run: node tests/browser/navigation-workspace.mjs
      - name: Save MRP layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mrp-ui-screenshots
          path: test-results/mrp
          if-no-files-found: ignore
      - name: Save navigation and purchasing screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navigation-ui-screenshots
          path: test-results/navigation
          if-no-files-found: ignore
      - name: Publish MRP browser diagnostic on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          let report={error:'Browser job failed before the interaction test completed.'};
          for(const file of ['test-results/mrp/diagnostic.json','test-results/pos/diagnostic.json']){try{report=JSON.parse(readFileSync(file,'utf8'));break;}catch{}}
          for(const key of ['error','pageError','server']){
            if(!report[key])continue;
            const description=report[key].replace(/\x1b\[[0-9;]*m/g,'').replace(/\s+/g,' ').slice(0,140);
            const response=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/statuses/'+process.env.GITHUB_SHA,{method:'POST',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'},body:JSON.stringify({state:'failure',context:'MRP browser '+key,description,target_url:'https://github.com/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID})});
            if(!response.ok)throw Error('Unable to publish browser diagnostic: '+response.status);
          }
          JS
